name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Conferir encoding dos arquivos de texto
        run: python tools/verificar_encoding.py

      - name: Verificar que o pacote importa
        run: python -c "import finops; print(finops.__version__)"

      - name: Rodar testes com cobertura
        run: python -m pytest --cov=finops --cov-report=term-missing --cov-report=xml

      - name: Conferir cobertura minima
        run: python -m coverage report --fail-under=70

      - name: Prova de aceite
        run: python tools/verificar_aceite.py

      - name: O CLI sinaliza anomalia com saida diferente de zero
        run: |
          python -m finops resumo dados/cobranca-ficticia.csv
          if ($LASTEXITCODE -eq 0) {
            Write-Error "havendo anomalia alta, o CLI deveria sair com 1"
            exit 1
          }
          Write-Output "ok: anomalia sinalizada com codigo diferente de zero"

      - name: O relatorio HTML e gerado
        run: |
          python -m finops relatorio dados/cobranca-ficticia.csv --saida exemplos/relatorio-custo.html
          git diff --exit-code -- exemplos/relatorio-custo.html